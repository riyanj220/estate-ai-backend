# The Field registry (AD-4). Every change needs a version bump and a new lock:
#   uv run python scripts/registry_lock.py
# Format and rules: docs/registry.md
version: 12

taxonomy:
  purposes: [sale, rent]
  categories:
    - id: house
      subtypes: [house]
    - id: apartment
      subtypes: [apartment]
    - id: plot
      subtypes: [residential_plot, commercial_plot, plot_file]
    - id: commercial
      subtypes: [shop, office]

fields:
  - id: purpose
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [sale, rent]
    class: public
    quota_identity: true
  - id: category
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [house, apartment, plot, commercial]
    class: public
    quota_identity: true
  - id: subtype
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [house, apartment, residential_plot, commercial_plot, plot_file, shop, office]
    class: public
    quota_identity: true
    valuation_input: true
  - id: title
    type: text
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    min_length: 10
    max_length: 100
    class: public
    searchable: true
    ai_extractable: true
  - id: description
    type: text
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: []}
    max_length: 5000
    class: public
    searchable: true
    ai_extractable: true
  - id: asking_price
    type: money
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    min: "0.01"
    max: "999999999999.99"
    currency: PKR
    class: public
    searchable: true
    sortable: true
    ai_extractable: true
  - id: price_basis
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [total, per_unit, rental_period]
    allowed_values_by_purpose:
      sale: [total, per_unit]
      rent: [rental_period]
    class: public
    searchable: true
  - id: rental_period
    type: enum
    section: terms
    requirement: required_for_publication
    applicability: {purposes: [rent], categories: [], subtypes: []}
    allowed_values: [day, week, month, year]
    class: public
    searchable: true
  - id: area_value
    type: decimal
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    min: "0.0001"
    max: "9999999999.9999"
    scale: 4
    error_code: invalid_area
    class: public
    searchable: true
    sortable: true
    ai_extractable: true
    valuation_input: true
    quota_identity: true
  - id: area_unit
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [sqft, sqyd, marla, kanal, acre]
    class: public
    searchable: true
    ai_extractable: true
    valuation_input: true
    quota_identity: true
  - id: marla_basis
    type: enum
    requirement: optional
    description: Square feet in one marla. Applies only while the unit is marla or kanal.
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: ["225", "250", "272.25"]
    class: public
    ai_extractable: true
    valuation_input: true
  - id: area_sqft
    type: decimal
    derived: true
    requirement: optional
    description: Area in square feet, computed from the value, unit and marla basis.
    applicability: {purposes: [], categories: [], subtypes: []}
    min: "0.0001"
    max: "9999999999999999.9999"
    scale: 4
    class: public
    searchable: true
    sortable: true
  - id: bedrooms
    type: integer
    requirement: required_for_publication
    description: Number of bedrooms. 0 for a studio.
    applicability: {purposes: [], categories: [], subtypes: [house, apartment]}
    min: 0
    max: 50
    class: public
    searchable: true
    ai_extractable: true
    valuation_input: true
  - id: bathrooms
    type: integer
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: [house, apartment]}
    min: 0
    max: 50
    class: public
    searchable: true
    ai_extractable: true
    valuation_input: true
  - id: construction_year
    type: integer
    requirement: recommended
    description: Year the building was built.
    applicability: {purposes: [], categories: [], subtypes: [house, apartment]}
    min: 1900
    max: 2100
    class: public
    ai_extractable: true
    valuation_input: true
  - id: condition
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house, apartment, shop, office]}
    allowed_values: [new, excellent, good, needs_renovation]
    class: public
    ai_extractable: true
    valuation_input: true
  - id: furnishing
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house, apartment, shop, office]}
    allowed_values: [unfurnished, semi_furnished, furnished]
    class: public
    searchable: true
    ai_extractable: true
  - id: parking_spaces
    type: integer
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house, apartment, shop, office]}
    min: 0
    max: 50
    class: public
    searchable: true
    ai_extractable: true
  - id: occupancy_status
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house, apartment, shop, office]}
    allowed_values: [owner_occupied, tenant_occupied, vacant]
    class: public
    ai_extractable: true
  - id: covered_area_sqft
    type: decimal
    requirement: recommended
    description: Covered area in square feet, whatever unit the area uses.
    applicability: {purposes: [], categories: [], subtypes: [house, apartment]}
    min: "0.0001"
    max: "9999999999.9999"
    scale: 4
    error_code: invalid_area
    class: public
    ai_extractable: true
    valuation_input: true
  - id: total_floors
    type: integer
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 1
    max: 200
    class: public
    ai_extractable: true
  - id: kitchens
    type: integer
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: construction_status
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house]}
    allowed_values: [completed, under_construction, grey_structure]
    class: public
    ai_extractable: true
  - id: drawing_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: dining_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: tv_lounges
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: study_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: prayer_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: store_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: laundry_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: powder_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: servant_quarters
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: basement
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    class: public
    ai_extractable: true
  - id: floor_number
    type: integer
    requirement: recommended
    description: Floor of the unit. 0 is the ground floor.
    applicability: {purposes: [], categories: [], subtypes: [apartment, shop, office]}
    min: 0
    max: 200
    class: public
    ai_extractable: true
  - id: building_floors
    type: integer
    requirement: recommended
    description: Number of floors in the building.
    applicability: {purposes: [], categories: [], subtypes: [apartment, shop, office]}
    min: 1
    max: 200
    class: public
    ai_extractable: true
  - id: lift
    type: boolean
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [apartment, office]}
    class: public
    ai_extractable: true
  - id: backup_electricity
    type: boolean
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [apartment]}
    class: public
    ai_extractable: true
  - id: building_security
    type: boolean
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [apartment, shop, office]}
    class: public
    ai_extractable: true
  - id: balcony_or_terrace
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [apartment]}
    class: public
    ai_extractable: true
  - id: building_lobby
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [apartment, shop, office]}
    class: public
    ai_extractable: true
  - id: intercom
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [apartment]}
    class: public
    ai_extractable: true
  - id: maintenance_charges
    type: money
    requirement: optional
    description: Maintenance charges in PKR per month.
    applicability: {purposes: [], categories: [], subtypes: [apartment, shop, office]}
    min: "0"
    max: "999999999999.99"
    currency: PKR
    class: public
    ai_extractable: true
  - id: electricity
    type: boolean
    requirement: recommended
    description: Electricity connection available.
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file, shop, office]}
    class: public
    ai_extractable: true
  - id: water
    type: boolean
    requirement: recommended
    description: Water connection available.
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file, shop, office]}
    class: public
    ai_extractable: true
  - id: gas
    type: boolean
    requirement: optional
    description: Gas connection available.
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file, shop, office]}
    class: public
    ai_extractable: true
  - id: plot_width
    type: decimal
    requirement: recommended
    description: Plot width in feet.
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    min: "0.01"
    max: "99999.99"
    scale: 2
    valuation_input: true
    class: public
    ai_extractable: true
  - id: plot_depth
    type: decimal
    requirement: recommended
    description: Plot depth in feet.
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    min: "0.01"
    max: "99999.99"
    scale: 2
    valuation_input: true
    class: public
    ai_extractable: true
  - id: possession_status
    type: enum
    requirement: recommended
    description: As stated by the seller. A Plot File is never possession-ready.
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    allowed_values: [possession_ready, possession_pending, file_only]
    allowed_values_by_subtype:
      residential_plot: [possession_ready, possession_pending]
      commercial_plot: [possession_ready, possession_pending]
      plot_file: [file_only]
    class: public
    seller_declared: true
  - id: corner_plot
    type: boolean
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    valuation_input: true
    class: public
    ai_extractable: true
  - id: road_width_ft
    type: decimal
    requirement: recommended
    description: Width of the road in front, in feet.
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    min: "1.00"
    max: "999.99"
    scale: 2
    valuation_input: true
    class: public
    ai_extractable: true
  - id: balloting_status
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    allowed_values: [not_applicable, balloting_pending, balloted]
    class: public
    seller_declared: true
  - id: sewerage
    type: boolean
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    class: public
    ai_extractable: true
  - id: development_status
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    allowed_values: [developed, partially_developed, undeveloped]
    valuation_input: true
    class: public
    seller_declared: true
  - id: approval_authority
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    allowed_values: [lda, cda, kda, rda, fda, mda, gda, bda, peshawar_development_authority, private_society, none, other]
    class: public
    seller_declared: true
  - id: park_facing
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    class: public
    ai_extractable: true
  - id: main_boulevard
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    class: public
    ai_extractable: true
  - id: boundary_wall
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    class: public
    ai_extractable: true
  - id: orientation
    type: enum
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [residential_plot, commercial_plot, plot_file]}
    allowed_values: [north, south, east, west, north_east, north_west, south_east, south_west]
    class: public
    ai_extractable: true
  - id: plot_file_status
    type: enum
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [plot_file]}
    allowed_values: [open_file, allocation_letter, possession_letter]
    class: public
    seller_declared: true
  - id: business_use
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [shop, office]}
    allowed_values: [retail, restaurant, office_work, clinic, warehouse, showroom, mixed, other]
    class: public
    ai_extractable: true
  - id: frontage_ft
    type: decimal
    requirement: recommended
    description: Width of the frontage in feet.
    applicability: {purposes: [], categories: [], subtypes: [shop]}
    min: "0.01"
    max: "9999.99"
    scale: 2
    valuation_input: true
    class: public
    ai_extractable: true
  - id: road_access
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [shop, office]}
    allowed_values: [main_road, secondary_road, inner_street]
    class: public
    ai_extractable: true
  - id: ceiling_height_ft
    type: decimal
    requirement: optional
    description: Ceiling height in feet.
    applicability: {purposes: [], categories: [], subtypes: [shop, office]}
    min: "1.00"
    max: "99.99"
    scale: 2
    class: public
    ai_extractable: true
  - id: power_load_kw
    type: decimal
    requirement: optional
    description: Sanctioned power load in kilowatts.
    applicability: {purposes: [], categories: [], subtypes: [shop, office]}
    min: "0.01"
    max: "99999.99"
    scale: 2
    class: public
    ai_extractable: true
  - id: three_phase_electricity
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [shop, office]}
    class: public
    ai_extractable: true
  - id: conference_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [office]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: business_centre_facilities
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [office]}
    class: public
    ai_extractable: true
  - id: price_negotiable
    type: boolean
    section: terms
    requirement: optional
    description: The price can be discussed.
    applicability: {purposes: [], categories: [], subtypes: []}
    class: public
    ai_extractable: true
  - id: possession_availability
    type: enum
    section: terms
    requirement: recommended
    description: When the buyer can take possession, as the seller states it.
    applicability: {purposes: [sale], categories: [], subtypes: []}
    allowed_values: [available_now, within_one_month, within_three_months, after_three_months]
    seller_declared: true
    class: public
  - id: security_deposit
    type: money
    section: terms
    requirement: recommended
    description: Security deposit in PKR.
    applicability: {purposes: [rent], categories: [], subtypes: []}
    min: "0"
    max: "999999999999.99"
    currency: PKR
    class: public
    ai_extractable: true
  - id: availability_date
    type: date
    section: terms
    requirement: recommended
    description: The date the property is available from, as a calendar date (YYYY-MM-DD).
    applicability: {purposes: [rent], categories: [], subtypes: []}
    min: "2000-01-01"
    max: "2100-12-31"
    class: public
    ai_extractable: true
  - id: advance_rent
    type: money
    section: terms
    requirement: optional
    description: Rent paid in advance in PKR.
    applicability: {purposes: [rent], categories: [], subtypes: []}
    min: "0"
    max: "999999999999.99"
    currency: PKR
    class: public
    ai_extractable: true
  - id: minimum_lease_months
    type: integer
    section: terms
    requirement: optional
    description: Shortest lease in months.
    applicability: {purposes: [rent], categories: [], subtypes: []}
    min: 1
    max: 120
    class: public
    ai_extractable: true
  - id: notice_period_days
    type: integer
    section: terms
    requirement: optional
    description: Notice period in days.
    applicability: {purposes: [rent], categories: [], subtypes: []}
    min: 0
    max: 365
    class: public
    ai_extractable: true
  - id: utility_electricity_included
    type: boolean
    section: terms
    requirement: optional
    description: Electricity is included in the rent.
    applicability: {purposes: [rent], categories: [], subtypes: []}
    class: public
    ai_extractable: true
  - id: utility_gas_included
    type: boolean
    section: terms
    requirement: optional
    description: Gas is included in the rent.
    applicability: {purposes: [rent], categories: [], subtypes: []}
    class: public
    ai_extractable: true
  - id: utility_water_included
    type: boolean
    section: terms
    requirement: optional
    description: Water is included in the rent.
    applicability: {purposes: [rent], categories: [], subtypes: []}
    class: public
    ai_extractable: true
  - id: utility_internet_included
    type: boolean
    section: terms
    requirement: optional
    description: Internet is included in the rent.
    applicability: {purposes: [rent], categories: [], subtypes: []}
    class: public
    ai_extractable: true
  - id: pets_allowed
    type: boolean
    section: terms
    requirement: optional
    description: Pets are allowed.
    applicability: {purposes: [rent], categories: [], subtypes: []}
    class: public
    ai_extractable: true
  - id: occupant_restrictions
    type: enum
    section: terms
    requirement: optional
    description: Who may rent, as the owner states it.
    applicability: {purposes: [rent], categories: [], subtypes: []}
    allowed_values: [no_restriction, families_only, bachelors_only]
    class: public
    ai_extractable: true
  - id: city
    type: reference
    reference: city
    section: location
    requirement: required_for_publication
    description: The city, chosen from the city list. Changing it clears the locality.
    applicability: {purposes: [], categories: [], subtypes: []}
    class: public
    searchable: true
    quota_identity: true
  - id: locality
    type: reference
    reference: locality
    section: location
    requirement: required_for_publication
    description: The area or society, chosen from the localities of the city.
    applicability: {purposes: [], categories: [], subtypes: []}
    class: public
    searchable: true
    quota_identity: true
    valuation_input: true
  - id: society
    type: text
    section: location
    requirement: optional
    description: Housing society or scheme, shown to everyone.
    applicability: {purposes: [], categories: [], subtypes: []}
    max_length: 60
    class: public
    ai_extractable: true
  - id: phase
    type: text
    section: location
    requirement: optional
    description: Phase, shown to everyone.
    applicability: {purposes: [], categories: [], subtypes: []}
    max_length: 60
    class: public
    ai_extractable: true
  - id: sector
    type: text
    section: location
    requirement: optional
    description: Sector, shown to everyone.
    applicability: {purposes: [], categories: [], subtypes: []}
    max_length: 60
    class: public
    ai_extractable: true
  - id: block
    type: text
    section: location
    requirement: optional
    description: Block, shown to everyone.
    applicability: {purposes: [], categories: [], subtypes: []}
    max_length: 60
    class: public
    ai_extractable: true
  - id: street
    type: text
    section: location
    requirement: optional
    description: Street of the property. Private, only the owner sees it.
    applicability: {purposes: [], categories: [], subtypes: []}
    max_length: 120
    class: private
  - id: house_number
    type: text
    section: location
    requirement: optional
    description: House or plot number. Private, only the owner sees it.
    applicability: {purposes: [], categories: [], subtypes: []}
    max_length: 30
    class: private
  - id: latitude
    type: decimal
    section: location
    requirement: optional
    description: Latitude in degrees, -90 to 90. Private, only the owner sees it.
    applicability: {purposes: [], categories: [], subtypes: []}
    signed: true
    min: "-90"
    max: "90"
    scale: 6
    error_code: out_of_range
    class: private
  - id: longitude
    type: decimal
    section: location
    requirement: optional
    description: Longitude in degrees, -180 to 180. Private, only the owner sees it.
    applicability: {purposes: [], categories: [], subtypes: []}
    signed: true
    min: "-180"
    max: "180"
    scale: 6
    error_code: out_of_range
    class: private
  - id: amenities
    type: amenities
    section: amenities
    requirement: optional
    description: Amenity code to present or none. A code left out is unanswered, never none.
    applicability: {purposes: [], categories: [], subtypes: []}
    class: public
    searchable: true
    valuation_input: true
  - id: payment_type
    type: enum
    section: terms
    requirement: optional
    description: How the buyer can pay.
    applicability: {purposes: [sale], categories: [], subtypes: []}
    allowed_values: [cash, installments, cash_or_installments]
    searchable: true
    ai_extractable: true
    class: public
  - id: down_payment
    type: money
    section: terms
    requirement: optional
    description: Down payment in PKR.
    applicability: {purposes: [sale], categories: [], subtypes: []}
    min: "0"
    max: "999999999999.99"
    currency: PKR
    ai_extractable: true
    class: public
  - id: total_installment_price
    type: money
    section: terms
