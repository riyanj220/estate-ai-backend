# The Field registry (AD-4). Every change needs a version bump and a new lock:
#   uv run python scripts/registry_lock.py
# Format and rules: docs/registry.md
version: 4

taxonomy:
  purposes: [sale, rent]
  categories:
    - id: house
      subtypes: [house]
    - id: apartment
      subtypes: [apartment]
    - id: plot
      subtypes: [residential_plot, commercial_plot, plot_file]
    - id: commercial
      subtypes: [shop, office]

fields:
  - id: purpose
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [sale, rent]
    class: public
    quota_identity: true
  - id: category
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [house, apartment, plot, commercial]
    class: public
    quota_identity: true
  - id: subtype
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [house, apartment, residential_plot, commercial_plot, plot_file, shop, office]
    class: public
    quota_identity: true
  - id: title
    type: text
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    min_length: 10
    max_length: 100
    class: public
    searchable: true
    ai_extractable: true
  - id: description
    type: text
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: []}
    max_length: 5000
    class: public
    searchable: true
    ai_extractable: true
  - id: asking_price
    type: money
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    min: "0.01"
    max: "999999999999.99"
    currency: PKR
    class: public
    searchable: true
    sortable: true
    ai_extractable: true
  - id: price_basis
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [total, per_unit, rental_period]
    allowed_values_by_purpose:
      sale: [total, per_unit]
      rent: [rental_period]
    class: public
    searchable: true
  - id: rental_period
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [rent], categories: [], subtypes: []}
    allowed_values: [day, week, month, year]
    class: public
    searchable: true
  - id: area_value
    type: decimal
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    min: "0.0001"
    max: "9999999999.9999"
    scale: 4
    class: public
    searchable: true
    sortable: true
    ai_extractable: true
    valuation_input: true
  - id: area_unit
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [sqft, sqyd, marla, kanal, acre]
    class: public
    searchable: true
    ai_extractable: true
    valuation_input: true
  - id: marla_basis
    type: enum
    requirement: optional
    description: Square feet in one marla. Applies only while the unit is marla or kanal.
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: ["225", "250", "272.25"]
    class: public
    ai_extractable: true
    valuation_input: true
  - id: area_sqft
    type: decimal
    derived: true
    requirement: optional
    description: Area in square feet, computed from the value, unit and marla basis.
    applicability: {purposes: [], categories: [], subtypes: []}
    min: "0.0001"
    max: "9999999999999999.9999"
    scale: 4
    class: public
    searchable: true
    sortable: true
  - id: bedrooms
    type: integer
    requirement: required_for_publication
    description: Number of bedrooms. 0 for a studio.
    applicability: {purposes: [], categories: [], subtypes: [house, apartment]}
    min: 0
    max: 50
    class: public
    searchable: true
    ai_extractable: true
    valuation_input: true
  - id: bathrooms
    type: integer
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: [house, apartment]}
    min: 0
    max: 50
    class: public
    searchable: true
    ai_extractable: true
    valuation_input: true
  - id: construction_year
    type: integer
    requirement: recommended
    description: Year the building was built.
    applicability: {purposes: [], categories: [], subtypes: [house, apartment]}
    min: 1900
    max: 2100
    class: public
    ai_extractable: true
    valuation_input: true
  - id: condition
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house, apartment]}
    allowed_values: [new, excellent, good, needs_renovation]
    class: public
    ai_extractable: true
    valuation_input: true
  - id: furnishing
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house, apartment]}
    allowed_values: [unfurnished, semi_furnished, furnished]
    class: public
    searchable: true
    ai_extractable: true
  - id: parking_spaces
    type: integer
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house, apartment]}
    min: 0
    max: 50
    class: public
    searchable: true
    ai_extractable: true
  - id: occupancy_status
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house, apartment]}
    allowed_values: [owner_occupied, tenant_occupied, vacant]
    class: public
    ai_extractable: true
  - id: covered_area_sqft
    type: decimal
    requirement: recommended
    description: Covered area in square feet, whatever unit the area uses.
    applicability: {purposes: [], categories: [], subtypes: [house, apartment]}
    min: "0.0001"
    max: "9999999999.9999"
    scale: 4
    class: public
    ai_extractable: true
    valuation_input: true
  - id: total_floors
    type: integer
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 1
    max: 200
    class: public
    ai_extractable: true
  - id: kitchens
    type: integer
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: construction_status
    type: enum
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [house]}
    allowed_values: [completed, under_construction, grey_structure]
    class: public
    ai_extractable: true
  - id: drawing_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: dining_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: tv_lounges
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: study_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: prayer_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: store_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: laundry_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: powder_rooms
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: servant_quarters
    type: integer
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    min: 0
    max: 50
    class: public
    ai_extractable: true
  - id: basement
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [house]}
    class: public
    ai_extractable: true
  - id: floor_number
    type: integer
    requirement: recommended
    description: Floor of the apartment. 0 is the ground floor.
    applicability: {purposes: [], categories: [], subtypes: [apartment]}
    min: 0
    max: 200
    class: public
    ai_extractable: true
  - id: building_floors
    type: integer
    requirement: recommended
    description: Number of floors in the building.
    applicability: {purposes: [], categories: [], subtypes: [apartment]}
    min: 1
    max: 200
    class: public
    ai_extractable: true
  - id: lift
    type: boolean
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [apartment]}
    class: public
    ai_extractable: true
  - id: backup_electricity
    type: boolean
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [apartment]}
    class: public
    ai_extractable: true
  - id: building_security
    type: boolean
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: [apartment]}
    class: public
    ai_extractable: true
  - id: balcony_or_terrace
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [apartment]}
    class: public
    ai_extractable: true
  - id: building_lobby
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [apartment]}
    class: public
    ai_extractable: true
  - id: intercom
    type: boolean
    requirement: optional
    applicability: {purposes: [], categories: [], subtypes: [apartment]}
    class: public
    ai_extractable: true
  - id: maintenance_charges
    type: money
    requirement: optional
    description: Maintenance charges in PKR per month.
    applicability: {purposes: [], categories: [], subtypes: [apartment]}
    min: "0"
    max: "999999999999.99"
    currency: PKR
    class: public
    ai_extractable: true
