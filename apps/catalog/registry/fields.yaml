# The Field registry (AD-4). Every change needs a version bump and a new lock:
#   uv run python scripts/registry_lock.py
# Format and rules: docs/registry.md
version: 3

taxonomy:
  purposes: [sale, rent]
  categories:
    - id: house
      subtypes: [house]
    - id: apartment
      subtypes: [apartment]
    - id: plot
      subtypes: [residential_plot, commercial_plot, plot_file]
    - id: commercial
      subtypes: [shop, office]

fields:
  - id: purpose
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [sale, rent]
    class: public
    quota_identity: true
  - id: category
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [house, apartment, plot, commercial]
    class: public
    quota_identity: true
  - id: subtype
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [house, apartment, residential_plot, commercial_plot, plot_file, shop, office]
    class: public
    quota_identity: true
  - id: title
    type: text
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    min_length: 10
    max_length: 100
    class: public
    searchable: true
    ai_extractable: true
  - id: description
    type: text
    requirement: recommended
    applicability: {purposes: [], categories: [], subtypes: []}
    max_length: 5000
    class: public
    searchable: true
    ai_extractable: true
  - id: asking_price
    type: money
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    min: "0.01"
    max: "999999999999.99"
    currency: PKR
    class: public
    searchable: true
    sortable: true
    ai_extractable: true
  - id: price_basis
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [total, per_unit, rental_period]
    allowed_values_by_purpose:
      sale: [total, per_unit]
      rent: [rental_period]
    class: public
    searchable: true
  - id: rental_period
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [rent], categories: [], subtypes: []}
    allowed_values: [day, week, month, year]
    class: public
    searchable: true
  - id: area_value
    type: decimal
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    min: "0.0001"
    max: "9999999999.9999"
    scale: 4
    class: public
    searchable: true
    sortable: true
    ai_extractable: true
    valuation_input: true
  - id: area_unit
    type: enum
    requirement: required_for_publication
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: [sqft, sqyd, marla, kanal, acre]
    class: public
    searchable: true
    ai_extractable: true
    valuation_input: true
  - id: marla_basis
    type: enum
    requirement: optional
    description: Square feet in one marla. Applies only while the unit is marla or kanal.
    applicability: {purposes: [], categories: [], subtypes: []}
    allowed_values: ["225", "250", "272.25"]
    class: public
    ai_extractable: true
    valuation_input: true
  - id: area_sqft
    type: decimal
    derived: true
    requirement: optional
    description: Area in square feet, computed from the value, unit and marla basis.
    applicability: {purposes: [], categories: [], subtypes: []}
    min: "0.0001"
    max: "9999999999999999.9999"
    scale: 4
    class: public
    searchable: true
    sortable: true
