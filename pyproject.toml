[project]
name = "estate-ai-backend"
version = "0.1.0"
description = "EstateAI backend: Django modular monolith served by Daphne."
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "daphne>=4.1",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "_bmad", "_bmad-output", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
