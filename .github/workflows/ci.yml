name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "_bmad-output/**", "docs/**", ".gitignore"]
  pull_request:
    paths-ignore: ["**/*.md", "_bmad-output/**", "docs/**", ".gitignore"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Import contracts
        run: uv run lint-imports

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser-password-not-a-secret-0123456789
          POSTGRES_DB: estate_ai
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: estate_ai
      POSTGRES_USER: postgres
      PGPASSWORD: ci-superuser-password-not-a-secret-0123456789
      MIGRATOR_USER: migrator
      MIGRATOR_PASSWORD: ci-migrator-password-not-a-secret-0123456789
      RUNTIME_USER: runtime
      RUNTIME_PASSWORD: ci-runtime-password-not-a-secret-0123456789
      PGHOST: 127.0.0.1
      DJANGO_ALLOWED_HOSTS: testserver,127.0.0.1,localhost
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
      MAIL_HOST: smtp.ci.invalid
      MAIL_FROM: ci@example.org
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Create database roles
        run: docker/postgres/create_roles.sh
      # One database per xdist worker (test_estate_ai_gw0, ...), created by the migrator role.
      - run: uv run pytest -n auto
      # NFR-1 timing budgets (docs/performance.md): serial, about a minute, deselected above.
      - name: Performance budgets
        run: uv run pytest -m perf -s --show-capture=no -p no:logging

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv audit --frozen --preview-features audit-command
